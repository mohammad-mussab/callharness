[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callharness-sdk"
version = "0.1.0"
description = "Python SDK for CallHarness - open-source call analytics for voice AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.25"]

[project.optional-dependencies]
pipecat = ["pipecat-ai>=0.0.60"]

[tool.hatch.build.targets.wheel]
packages = ["callharness_sdk"]
