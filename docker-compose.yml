services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: callharness
      POSTGRES_PASSWORD: callharness
      POSTGRES_DB: callharness
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U callharness"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./server
    environment:
      CALLHARNESS_DATABASE_URL: postgresql+asyncpg://callharness:callharness@db:5432/callharness
      CALLHARNESS_DATA_DIR: /data
      # Provide one of these to enable post-call analysis:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Optional: protect write endpoints
      CALLHARNESS_API_KEY: ${CALLHARNESS_API_KEY:-}
    volumes:
      - calls_data:/data
    ports:
      - "8010:8010"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      # Build arg, not just runtime env: next build bakes the rewrite destination
      # into the routes manifest. See web/Dockerfile.
      args:
        CALLHARNESS_API_URL: http://api:8010
    environment:
      CALLHARNESS_API_URL: http://api:8010
    ports:
      - "3010:3010"
    depends_on:
      - api

volumes:
  pgdata:
  calls_data:
